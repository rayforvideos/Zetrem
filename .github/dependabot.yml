# Alerts alone say a package is bad after the fact; these open the pull request
# that moves off it. Grouped so a week's worth of bumps is one PR to read, and
# CI runs against the lot at once.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dependencies:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
