name: Platforms

on:
  workflow_dispatch:
    inputs:
      sign:
        description: 'Sign and notarise the macOS build. Publishes nothing.'
        type: boolean
        default: false
  push:
    tags: ['v*']

concurrency:
  group: platforms-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        node: ['22.19', '24.11']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit-shape test reads the log, and a shallow clone holds only
          # the merge commit GitHub writes for a pull request run.
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Formatting and lint
        run: npm run lint

      - name: Types
        run: npm run typecheck

      - name: Architecture
        run: npm run fsd

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Translations are in step with the source
        # Windows runners default to PowerShell, which does not read a backslash
        # as a line continuation.
        shell: bash
        run: |
          npm run i18n:extract -- --clean
          git diff --exit-code -- src/shared/locales \
            || (echo "::error::카탈로그가 원문과 다르다. npm run i18n:extract 를 돌려 커밋해라" && exit 1)

  # On Windows npm leaves a claude.cmd shim on the PATH, not a claude binary.
  launch:
    name: launch (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22.19'
          cache: npm
      - run: npm ci
      - name: Install the CLI the way a person would
        run: npm i -g @anthropic-ai/claude-code
      - name: What ended up on the PATH
        shell: bash
        run: |
          echo "which: $(command -v claude || echo none)"
          ls "$(npm prefix -g)/bin" 2>/dev/null | grep -i claude || true
          ls "$(npm prefix -g)" 2>/dev/null | grep -i claude || true
      - name: Launch it the way the app does
        run: npm run test:contract -- tests/contract/launch.contract.test.ts

  package:
    name: package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    env:
      RELEASING: ${{ startsWith(github.ref, 'refs/tags/v') }}
      SIGNED: >-
        ${{ (startsWith(github.ref, 'refs/tags/v') || inputs.sign == true)
            && secrets.CSC_LINK != '' }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22.19'
          cache: npm
      - run: npm ci
      - name: Package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ env.SIGNED }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # Blanking any of these three is what turns notarisation off.
          APPLE_ID: ${{ env.SIGNED == 'true' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ env.SIGNED == 'true' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ env.SIGNED == 'true' && secrets.APPLE_TEAM_ID || '' }}
        # --publish never: electron-builder's own uploader races itself and can
        # leave a release holding a blockmap and no installer; the upload below
        # either works or fails the job.
        #
        # An empty CSC_LINK is not "no certificate" to electron-builder, it is
        # a path, and "not a file". Unsigned builds must not carry the variable.
        shell: bash
        run: |
          [ "$SIGNED" = "true" ] || unset CSC_LINK CSC_KEY_PASSWORD
          npm run ${{ matrix.os == 'windows-latest' && 'package:win' || 'package:mac' }} -- --publish never

      - name: Prove the fuses took
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            app=release/win-unpacked/Zetrem.exe
          else
            app=release/mac-universal/Zetrem.app
          fi
          npx @electron/fuses read --app "$app" | tee fuses.txt
          grep -q 'RunAsNode is Disabled' fuses.txt
          grep -q 'EnableNodeOptionsEnvironmentVariable is Disabled' fuses.txt
          grep -q 'EnableNodeCliInspectArguments is Disabled' fuses.txt
          grep -q 'EnableEmbeddedAsarIntegrityValidation is Enabled' fuses.txt
          grep -q 'OnlyLoadAppFromAsar is Enabled' fuses.txt

      # The Windows runner has no display, but Electron draws to nothing without
      # complaint, so launching for real still proves asar integrity took.
      # Staying alive is not enough: a window that failed to load its page
      # stays open on a trouble page, so main has to say what it is showing.
      - name: Prove the packaged app opens and shows its page
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            bin=release/win-unpacked/Zetrem.exe
          else
            bin=release/mac-universal/Zetrem.app/Contents/MacOS/Zetrem
          fi
          "$bin" > opened.log 2>&1 &
          pid=$!
          sleep 20
          if ! kill -0 "$pid" 2>/dev/null; then
            echo "::error::the packaged app exited on its own"
            cat opened.log
            exit 1
          fi
          kill "$pid" || true
          if grep -qE '\[window\] The window could not load|\[renderer\] crashed' opened.log; then
            echo "::error::the packaged app opened on its trouble page"
            cat opened.log
            exit 1
          fi
          if ! grep -q '^\[window\] showing ' opened.log; then
            echo "::error::the packaged app never said it was showing its page"
            cat opened.log
            exit 1
          fi
          grep '^\[window\] showing ' opened.log

      - name: Prove the macOS build is signed, notarised and would open
        if: matrix.os == 'macos-latest' && env.SIGNED == 'true'
        shell: bash
        run: |
          app=release/mac-universal/Zetrem.app
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign --display --verbose=2 "$app" 2>&1 | grep -E 'Authority|TeamIdentifier'
          xcrun stapler validate "$app"
          spctl --assess --type exec -vv "$app"

      - name: Publish the Windows installer
        if: matrix.os == 'windows-latest' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release view "$tag" >/dev/null 2>&1 ||
            gh release create "$tag" --prerelease --title "Zetrem ${tag#v}" --notes ''
          gh release upload "$tag" \
            release/Zetrem-*-x64.exe \
            release/Zetrem-*-x64.exe.blockmap \
            release/latest.yml \
            --clobber
          gh release view "$tag" --json assets --jq '.assets[].name'

      - name: Publish the macOS installer
        if: matrix.os == 'macos-latest' && startsWith(github.ref, 'refs/tags/v') && env.SIGNED == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          # The ticket is on the app the dmg was built from, never on the dmg.
          xcrun stapler validate release/mac-universal/Zetrem.app
          gh release view "$tag" >/dev/null 2>&1 ||
            gh release create "$tag" --prerelease --title "Zetrem ${tag#v}" --notes ''
          gh release upload "$tag" \
            release/Zetrem-*-universal.dmg \
            release/Zetrem-*-universal.dmg.blockmap \
            release/Zetrem-*-universal.zip \
            release/Zetrem-*-universal.zip.blockmap \
            release/latest-mac.yml \
            --clobber
          gh release view "$tag" --json assets --jq '.assets[].name'

      - name: What came out
        shell: bash
        run: ls -la release/ | head -20

  smoke:
    name: smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22.19'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Open the app and read its window
        run: npm run smoke
