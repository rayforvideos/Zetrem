name: CI

on:
  push:
    branches: [master]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.19', '24.11']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit-shape test reads the log, and a shallow clone holds only
          # the merge commit GitHub writes for a pull request run.
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Formatting and lint
        run: npm run lint

      - name: Types
        run: npm run typecheck

      - name: Architecture
        run: npm run fsd

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Coverage
        run: npm run coverage

      - name: Translations are in step with the source
        shell: bash
        run: |
          npm run i18n:extract -- --clean
          git diff --exit-code -- src/shared/locales \
            || (echo "::error::카탈로그가 원문과 다르다. npm run i18n:extract 를 돌려 커밋해라" && exit 1)
