name: CI

on:
  push:
    branches: [master]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Ubuntu because these checks are platform-agnostic and Linux minutes bill
  # at 1x against macOS's 10x. The platform-specific jobs (os-matrix check,
  # launch, package, smoke) live in platforms.yml and run on demand.
  check:
    name: check (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20.19', '22.19']
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Types
        run: npm run typecheck

      - name: Tests
        # Includes tests/conventions, which is where this repo's rules live.
        run: npm test

      - name: Build
        run: npm run build

      - name: Translations are in step with the source
        shell: bash
        run: |
          npm run i18n:extract -- --clean
          git diff --exit-code -- src/shared/locales \
            || (echo "::error::카탈로그가 원문과 다르다. npm run i18n:extract 를 돌려 커밋해라" && exit 1)
