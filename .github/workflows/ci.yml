name: CI

on:
  push:
    branches: [master]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Ubuntu because these checks are platform-agnostic and Linux minutes bill
  # at 1x against macOS's 10x. The platform-specific jobs (os-matrix check,
  # launch, package, smoke) live in platforms.yml and run on demand.
  check:
    name: check (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20.19', '22.19']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # The commit-shape test reads the log, and a shallow clone holds only
          # the merge commit GitHub writes for a pull request run.
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Formatting and lint
        run: npm run lint

      - name: Types
        run: npm run typecheck

      - name: Architecture
        # steiger holds the layer direction, the segments and the cross-imports.
        # tests/conventions holds the rest; CONTRIBUTING says which is which.
        run: npm run fsd

      - name: Tests
        # Includes tests/conventions, which is where this repo's rules live.
        run: npm test

      - name: Build
        run: npm run build

      - name: Coverage
        # Reported, not gated. Nobody has set a floor yet, and a threshold
        # picked before anybody has read the numbers is a number out of the air.
        run: npm run coverage

      - name: Translations are in step with the source
        shell: bash
        run: |
          npm run i18n:extract -- --clean
          git diff --exit-code -- src/shared/locales \
            || (echo "::error::카탈로그가 원문과 다르다. npm run i18n:extract 를 돌려 커밋해라" && exit 1)
