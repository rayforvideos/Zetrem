name: Demo

# The guided demo is a static page: it carries a recorded session and answers
# every reading from memory, so it needs no server, no key and no account.
#
# It publishes by pushing the built site to a branch rather than through the
# Pages actions, because those reach for actions of their own by tag and this
# repository runs nothing that is not pinned to a commit.
on:
  push:
    branches: [master]
    paths:
      - 'demo/**'
      - 'demo.html'
      - 'src/**'
      - 'vite.web.config.ts'
      - '.github/workflows/demo.yml'
  workflow_dispatch:

concurrency:
  group: demo-pages
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22.19'
          cache: npm
      - run: npm ci
      - run: npm run build:demo

      - name: Push the built page to its branch
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out/web
          # Pages serves what a Jekyll build leaves behind unless told not to,
          # and a bundler's folders are not Jekyll's to read.
          touch .nojekyll
          git init -q
          git checkout -q -b gh-pages
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -q -m "demo: built from ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
