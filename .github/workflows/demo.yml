name: Demo

# The guided demo is a static page: it carries a recorded session and answers
# every reading from memory, so it needs no server, no key and no account.
on:
  push:
    branches: [master]
    paths:
      - 'demo/**'
      - 'demo.html'
      - 'src/**'
      - 'vite.web.config.ts'
      - '.github/workflows/demo.yml'
  workflow_dispatch:

concurrency:
  group: demo-pages
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22.19'
          cache: npm
      - run: npm ci
      - run: npm run build:demo
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v4
