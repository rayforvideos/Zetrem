<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- 앱 아이콘: 어두운 배경 위 유리 한 장 — 제품의 Solo 화면 그대로 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b3d52"/>
      <stop offset="0.55" stop-color="#1c2836"/>
      <stop offset="1" stop-color="#101820"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0.30" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.50" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.70" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="squircle">
      <rect x="60" y="60" width="904" height="904" rx="200"/>
    </clipPath>
  </defs>
  <g clip-path="url(#squircle)">
    <rect x="60" y="60" width="904" height="904" fill="url(#bg)"/>
    <!-- 배경의 달 — 사용자가 올릴 사진의 자리 -->
    <circle cx="760" cy="260" r="150" fill="#e8ddc4" opacity="0.5"/>
    <circle cx="720" cy="300" r="190" fill="#d9e4ee" opacity="0.18"/>
    <!-- 유리 한 장: 얇은 표면 + 가는 테두리, 제품과 같은 문법 -->
    <rect x="192" y="256" width="640" height="512" rx="64"
          fill="#f6f7fa" fill-opacity="0.16"
          stroke="#ffffff" stroke-opacity="0.5" stroke-width="10"/>
    <!-- 경계 섬광 -->
    <rect x="192" y="256" width="640" height="512" rx="64" fill="url(#sweep)"/>
    <!-- 1층 헤드라인 자리 -->
    <rect x="256" y="336" width="288" height="40" rx="20" fill="#ffffff" opacity="0.85"/>
    <!-- 2층 스트림 -->
    <rect x="256" y="432" width="416" height="22" rx="11" fill="#ffffff" opacity="0.38"/>
    <rect x="256" y="484" width="352" height="22" rx="11" fill="#ffffff" opacity="0.30"/>
    <rect x="256" y="536" width="384" height="22" rx="11" fill="#ffffff" opacity="0.22"/>
    <!-- 3층 텔레메트리 -->
    <rect x="640" y="672" width="128" height="26" rx="13" fill="#ffffff" opacity="0.16"/>
  </g>
</svg>
